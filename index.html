<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>β as the data comes in</title>
<style>
  :root{
    --bg:#fbfaf7; --panel:#fff; --ink:#16181d; --ink2:#5a6270; --ink3:#98a0ae;
    --line:#e6e3dc; --accent:#1f6f5c; --band:rgba(31,111,92,.16); --zero:#c4553f;
    --mono:ui-monospace,"SF Mono",Menlo,monospace;
    --sans:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  }
  @media (prefers-color-scheme:dark){
    :root{ --bg:#12141a; --panel:#191c23; --ink:#e9ebf0; --ink2:#a6adba; --ink3:#6c7482;
           --line:#282d38; --accent:#4cc4a3; --band:rgba(76,196,163,.18); --zero:#e2705a; }
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--sans);line-height:1.5}
  .wrap{max-width:900px;margin:0 auto;padding:36px 20px 70px}
  h1{font-size:1.45rem;font-weight:660;letter-spacing:-.02em;margin:0 0 4px}
  .sub{color:var(--ink2);font-size:.93rem;margin:0 0 22px;max-width:60ch}
  .stats{display:flex;gap:26px;flex-wrap:wrap;background:var(--panel);border:1px solid var(--line);
    border-radius:12px;padding:15px 18px;margin-bottom:18px}
  .stat .k{font-size:.66rem;letter-spacing:.09em;text-transform:uppercase;color:var(--ink3);font-weight:650}
  .stat .v{font-family:var(--mono);font-size:1.3rem;font-weight:600;font-variant-numeric:tabular-nums}
  .card{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:16px 12px 8px}
  svg{display:block;width:100%;height:auto}
  .foot{margin-top:16px;color:var(--ink3);font-size:.78rem}
  .foot code{font-family:var(--mono)}
  .prog{height:6px;background:var(--line);border-radius:4px;overflow:hidden;margin-top:8px;max-width:340px}
  .prog i{display:block;height:100%;background:var(--accent)}
</style>
</head>
<body>
<div class="wrap">
  <h1>β as the data comes in</h1>
  <p class="sub">The pre-registered coefficient on summary stance, refitted after each additional
     participant. Points of final stance per point of summary stance; the band is the 95%&nbsp;interval.
     Aggregate estimates only &mdash; no participant data is published here.</p>

  <div class="stats" id="stats"></div>
  <div class="card"><svg id="chart" viewBox="0 0 900 460" role="img" aria-label="beta estimate against number of participants"></svg></div>
  <p class="foot" id="foot"></p>
</div>

<script>
const SVG = "http://www.w3.org/2000/svg";
const el = (n, a = {}) => { const e = document.createElementNS(SVG, n);
  for (const k in a) e.setAttribute(k, a[k]); return e; };

function render(data) {
  const pts = data.points, m = data.meta;
  const stats = document.getElementById("stats");
  const f = (x, d = 3) => x == null ? "—" : x.toFixed(d);
  stats.innerHTML = "";
  const add = (k, v, extra) => {
    const s = document.createElement("div"); s.className = "stat";
    s.innerHTML = `<div class="k">${k}</div><div class="v">${v}</div>${extra || ""}`;
    stats.appendChild(s);
  };
  add("β", f(m.beta));
  add("95% CI", `${f(m.lo, 2)} – ${f(m.hi, 2)}`);
  add("p", m.p == null ? "—" : (m.p < 1e-4 ? "&lt;0.0001" : m.p.toFixed(4)));
  add("participants", `${m.participants} / ${m.target}`,
      `<div class="prog"><i style="width:${Math.min(100, 100 * m.participants / m.target)}%"></i></div>`);

  const W = 900, H = 460, L = 62, R = 18, T = 18, B = 46;
  const svg = document.getElementById("chart");
  svg.innerHTML = "";
  if (!pts.length) return;

  const xs = pts.map(p => p.n);
  const x0 = Math.min(...xs), x1 = Math.max(m.target, Math.max(...xs));
  const lows = pts.map(p => p.lo), his = pts.map(p => p.hi);
  let y0 = Math.min(0, Math.min(...lows)), y1 = Math.max(0, Math.max(...his));
  const pad = (y1 - y0) * 0.12 || 0.1; y0 -= pad; y1 += pad;
  const X = v => L + (v - x0) / (x1 - x0) * (W - L - R);
  const Y = v => T + (y1 - v) / (y1 - y0) * (H - T - B);

  // grid + y axis
  const step = (y1 - y0) / 5;
  for (let i = 0; i <= 5; i++) {
    const v = y0 + i * step;
    svg.appendChild(el("line", {x1: L, x2: W - R, y1: Y(v), y2: Y(v),
      stroke: "var(--line)", "stroke-width": 1}));
    const t = el("text", {x: L - 9, y: Y(v) + 4, "text-anchor": "end",
      fill: "var(--ink3)", "font-size": 11, "font-family": "var(--mono)"});
    t.textContent = v.toFixed(2); svg.appendChild(t);
  }
  // zero line
  if (y0 < 0 && y1 > 0) {
    svg.appendChild(el("line", {x1: L, x2: W - R, y1: Y(0), y2: Y(0),
      stroke: "var(--zero)", "stroke-width": 1.4, "stroke-dasharray": "5 4"}));
    const z = el("text", {x: W - R - 3, y: Y(0) - 6, "text-anchor": "end",
      fill: "var(--zero)", "font-size": 11}); z.textContent = "no effect"; svg.appendChild(z);
  }
  // x ticks
  const xt = 6;
  for (let i = 0; i <= xt; i++) {
    const v = Math.round(x0 + i * (x1 - x0) / xt);
    const t = el("text", {x: X(v), y: H - B + 20, "text-anchor": "middle",
      fill: "var(--ink3)", "font-size": 11, "font-family": "var(--mono)"});
    t.textContent = v; svg.appendChild(t);
  }
  const xl = el("text", {x: (L + W - R) / 2, y: H - 6, "text-anchor": "middle",
    fill: "var(--ink2)", "font-size": 12}); xl.textContent = "participants collected";
  svg.appendChild(xl);
  const yl = el("text", {x: 14, y: (T + H - B) / 2, "text-anchor": "middle",
    fill: "var(--ink2)", "font-size": 12,
    transform: `rotate(-90 14 ${(T + H - B) / 2})`});
  yl.textContent = "β  (points of final stance per point of summary stance)";
  svg.appendChild(yl);

  // CI band
  const band = pts.map(p => `${X(p.n)},${Y(p.hi)}`)
    .concat(pts.slice().reverse().map(p => `${X(p.n)},${Y(p.lo)}`)).join(" ");
  svg.appendChild(el("polygon", {points: band, fill: "var(--band)"}));
  // central estimate
  svg.appendChild(el("polyline", {points: pts.map(p => `${X(p.n)},${Y(p.beta)}`).join(" "),
    fill: "none", stroke: "var(--accent)", "stroke-width": 2.1,
    "stroke-linejoin": "round"}));
  // latest point
  const last = pts[pts.length - 1];
  svg.appendChild(el("circle", {cx: X(last.n), cy: Y(last.beta), r: 4.5,
    fill: "var(--accent)", stroke: "var(--panel)", "stroke-width": 2}));

  document.getElementById("foot").innerHTML =
    `${pts.length} fits, n = ${pts[0].n}–${last.n}. Model: ` +
    `<code>final ~ initial + summary stance + document set (fixed) + (1 | participant)</code>. ` +
    `Updated ${m.updated} UTC. Page refreshes every 5 minutes.`;
}

function load() {
  fetch("beta_trace.json?" + Date.now())
    .then(r => r.json()).then(render)
    .catch(e => { document.getElementById("foot").textContent = "could not load data: " + e; });
}
load();
setInterval(load, 5 * 60 * 1000);
</script>
</body>
</html>
